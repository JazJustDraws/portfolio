	    <style>
        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .grid-item {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            filter: blur(0px);
        }

        .grid-item:hover {
            transform: scale(1.1);
            transition: transform 0.3s ease;
            filter: blur(5px);
        }

        .tile {
            position: relative;
            height: 250px;
            overflow: hidden;
            cursor: pointer;
        }

        .tile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: blur(0px);
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .tile:hover img {
            filter: blur(5px);
        }

        .tile:hover .overlay {
            opacity: 1;
        }
    </style>
